name: CI
on:
  # pull_request, not push to every branch: the repo is public, and a fork PR's
  # push runs in the fork, so it would never report ci_check_result here.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint and render charts
        run: |
          set -euo pipefail
          charts=()
          while IFS= read -r chart; do
            parent=$(dirname "$chart")
            # A chart in <chart>/charts/ is a vendored dependency. It is validated
            # through its parent, which supplies its values.
            if [ "$(basename "$parent")" = charts ] && [ -f "$(dirname "$parent")/Chart.yaml" ]; then
              continue
            fi
            charts+=("$chart")
          done < <(find parcellab -name Chart.yaml -exec dirname {} \; | sort)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "::error::No Chart.yaml found under parcellab"
            exit 1
          fi
          for chart in "${charts[@]}"; do
            echo "::group::$chart"
            helm dependency build "$chart"
            helm lint "$chart"
            # Library charts render nothing and make `helm template` fail.
            if ! helm show chart "$chart" | grep -q "^type: library"; then
              helm template "$chart" > /dev/null
            fi
            echo "::endgroup::"
          done

  # Required status check in branch protection (INF-4419). Fails if any
  # check failed or was cancelled.
  ci_check_result:
    needs:
      - helm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
