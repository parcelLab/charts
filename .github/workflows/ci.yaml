name: CI
on:
  # pull_request, not push to every branch: the repo is public, and a fork PR's
  # push runs in the fork, so it would never report ci_check_result here.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  helm:
    uses: parcelLab/ci/.github/workflows/helm.yaml@v9
    with:
      chartsPath: parcellab

  # Required status check in branch protection (INF-4419). Fails if any
  # check failed or was cancelled.
  ci_check_result:
    needs:
      - helm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
