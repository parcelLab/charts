name: JSON
on:
  push:
    branches:
      - main
    paths:
      - "**.json"
  pull_request:
    paths:
      - "**.json"
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up node environment
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Lint JSON
        run: npx --yes prettier@3.9.6 --check -- "**/*.json"
