name: Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yaml
      - parcellab/**
      - "!**.md"
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.generate-matrix.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load repos configuration file
        id: generate-matrix
        run: |
          export CHARTS=$(ls -d parcellab/* | awk ' BEGIN { ORS = ""; print "["; } { print "\/\@"$0"\/\@"; } END { print "]"; }' | sed "s^\"^\\\\\"^g;s^\/\@\/\@^\", \"^g;s^\/\@^\"^g")
          echo "::set-output name=charts::$CHARTS"
  test:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.matrix.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update dependencies
        run: helm dependency update ${{ matrix.chart }}

      - name: Lint chart
        run: helm lint ${{ matrix.chart }}

      - name: Template chart
        run: |
          helm show chart ${{ matrix.chart }} | grep "type: library" || helm template ${{ matrix.chart }} > output.yaml

      - if: matrix.chart != 'parcellab/common'
        name: Evaluate k8s resources
        uses: instrumenta/kubeval-action@master
        with:
          files: output.yaml
  release:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser library
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: parcellab
          charts_repo_url: https://charts.parcellab.dev
          config: cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: true

  publish-ecr:
    # TEMP(INF-4517): also run from the PR branch for the pre-merge test. Remove before merge.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/INF-4517-ecr-publish'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE_ARN_CUSTOM }}
          aws-region: ${{ env.AWS_REGION }}

      # Pushes each chart version that isn't in ECR yet. charts/<chart> is created
      # on first publish with immutable tags, so existing versions are skipped.
      - name: Publish charts to ECR
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | helm registry login --username AWS --password-stdin "$REGISTRY"
          for dir in parcellab/*/; do
            name="$(yq .name "$dir/Chart.yaml")"
            version="$(yq .version "$dir/Chart.yaml")"
            aws ecr describe-repositories --repository-names "charts/$name" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "charts/$name" --image-tag-mutability IMMUTABLE
            # OCI tags can't contain "+"; Helm stores SemVer build metadata as "_".
            if aws ecr describe-images --repository-name "charts/$name" --image-ids imageTag="${version//+/_}" >/dev/null 2>&1; then
              echo "Skipping $name $version, already in ECR"
              continue
            fi
            helm package --dependency-update "$dir" --destination .packages
            helm push ".packages/$name-$version.tgz" "oci://$REGISTRY/charts"
          done
